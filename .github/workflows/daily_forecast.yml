name: Daily Electricity Price Forecast

on:
  schedule:
    # 11:00 UTC = 13:00 EET in winter / 14:00 EEST in summer.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-electricity-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v

      - name: Run prediction system
        run: python src/predict_system.py

      - name: Commit updated forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/
          if git diff --staged --quiet; then
            echo "No forecast changes to commit"
          else
            git commit -m "forecast: $(date -u '+%Y-%m-%d') daily update"
            git push origin HEAD:${{ github.ref_name }}
          fi
